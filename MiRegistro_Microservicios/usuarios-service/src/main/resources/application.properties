spring.application.name=usuarios-service
server.port=8082

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/miregistro_usuarios?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.error.include-message=always

roles.service.url=http://localhost:8081
server.forward-headers-strategy=framework
app.avatares.carpeta=uploads/avatares
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
